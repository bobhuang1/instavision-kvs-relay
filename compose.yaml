# =============================================================================
# InstaVision-Relay - vendor cameras -> RTSP for Frigate
#
# The cameras (app: ai.instaview.guardian) are WebRTC viewers' peers on AWS
# Kinesis Video Streams channels. Nothing local is exposed: measured on
# 2026-10-31, every port is closed on all twelve (80/443/554/5000/8000/8080/
# 8888/34567) and the seven that answer ping share a single OUI (8c:5c:53). A
# relay is therefore the only way in: relay.py does the account login, joins
# each camera's KVS channel as a viewer, and copies the H.264 straight into
# ffmpeg which republishes to MediaMTX with `-c copy`. No decode, no transcode.
#
# Its own compose project so this stack can be restarted, updated or dropped
# without touching Frigate, Home Assistant or the other camera bridges. Both
# services run network_mode: host because camera WebRTC media arrives on random
# UDP ports and Frigate reads RTSP from the LAN.
#
# restart: always, so the stack comes back after a power cut even if it was
# stopped by hand beforehand.
#
# NOTHING IS PUBLISHED UNTIL A CAMERA IS ENROLLED. INSTAVISION_ENROLLED is the
# allowlist; while it is empty the relay logs that and publishes nothing, so a
# camera cannot quietly start using the uplink. Measured 2026-10-31: those
# cameras only join their KVS channel while a stream is being requested, so an
# idle account produces no traffic at all.
# =============================================================================
name: instavision-relay

services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.3@sha256:e3e9cd157344567a1a67f6c6606dcc7772b4ff589c23131832ffba3f92b97ca6
    restart: always
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  # Web UI + PTZ + snapshots. This process runs the relay in-process, so it is the
  # normal way to run this stack: the UI and the RTSP paths share one credential
  # path and one set of KVS sessions.
  gateway:
    build: .
    restart: always
    network_mode: host
    # The image's default command is the headless relay; this one serves the UI and
    # runs that same relay inside it.
    command: ["python3", "gateway.py"]
    # The gateway writes its admin account, enrollment list and session key into
    # ./state, which Docker mounts with host ownership. Run as the host user so
    # those writes succeed without chowning the directory to the image's user.
    user: "${INSTAVISION_UID:-1000}:${INSTAVISION_GID:-1000}"
    environment:
      INSTAVISION_EMAIL: ${INSTAVISION_EMAIL:-}
      INSTAVISION_PASSWORD: ${INSTAVISION_PASSWORD:-}
      INSTAVISION_PARTNER: ${INSTAVISION_PARTNER:-instaview}
      INSTAVISION_CLIENT_ID: ${INSTAVISION_CLIENT_ID:-home-user-portal}
      INSTAVISION_API: ${INSTAVISION_API:-https://api-us.instavision.ai/}
      INSTAVISION_FIREBASE_KEY: ${INSTAVISION_FIREBASE_KEY:-}
      INSTAVISION_KVS_REGION: ${INSTAVISION_KVS_REGION:-us-west-2}
      # Held open, not retried in a loop: the UI polls every 15 s, and refetching
      # credentials for a dozen cameras that often is what gets an account throttled.
      INSTAVISION_GATEWAY_ANSWER_TIMEOUT: ${INSTAVISION_GATEWAY_ANSWER_TIMEOUT:-600}
      INSTAVISION_SESSION_SECONDS: ${INSTAVISION_SESSION_SECONDS:-3600}
      INSTAVISION_RTSP_BASE: rtsp://127.0.0.1:8574
      INSTAVISION_RELAY_STATUS_PORT: 8656
      INSTAVISION_UI_PORT: ${INSTAVISION_UI_PORT:-8665}
      INSTAVISION_UI_BIND: ${INSTAVISION_UI_BIND:-0.0.0.0}
      INSTAVISION_UI_PASSWORD: ${INSTAVISION_UI_PASSWORD:-}
      INSTAVISION_DEVICE_TTL: ${INSTAVISION_DEVICE_TTL:-60}
      INSTAVISION_SNAPSHOT_TTL: ${INSTAVISION_SNAPSHOT_TTL:-30}
      INSTAVISION_WEBRTC_BASE: ${INSTAVISION_WEBRTC_BASE:-}
      INSTAVISION_RTSP_HOST: ${INSTAVISION_RTSP_HOST:-}
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - ./state:/app/state
    depends_on:
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${INSTAVISION_UI_PORT:-8665}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Headless relay only, for when there is no gateway. It is behind a profile so
  # `docker compose up` does not start a second set of KVS sessions for the same
  # cameras: enable it with `docker compose --profile relay up -d relay`.
  relay:
    profiles: ["relay"]
    build: .
    restart: always
    network_mode: host
    environment:
      # Read by probe.py / kvs_viewer.py, which the relay imports.
      INSTAVISION_EMAIL: ${INSTAVISION_EMAIL:-}
      INSTAVISION_PASSWORD: ${INSTAVISION_PASSWORD:-}
      INSTAVISION_PARTNER: ${INSTAVISION_PARTNER:-instaview}
      INSTAVISION_CLIENT_ID: ${INSTAVISION_CLIENT_ID:-home-user-portal}
      INSTAVISION_API: ${INSTAVISION_API:-https://api-us.instavision.ai/}
      INSTAVISION_FIREBASE_KEY: ${INSTAVISION_FIREBASE_KEY:-}
      INSTAVISION_KVS_REGION: ${INSTAVISION_KVS_REGION:-us-west-2}
      # Allowlist of camera names. Empty = publish nothing.
      INSTAVISION_ENROLLED: ${INSTAVISION_ENROLLED:-}
      # MediaMTX runs in its own container above; publishing is localhost-only.
      INSTAVISION_RTSP_BASE: rtsp://127.0.0.1:8574
      INSTAVISION_SESSION_SECONDS: ${INSTAVISION_SESSION_SECONDS:-3600}
      INSTAVISION_ANSWER_TIMEOUT: ${INSTAVISION_ANSWER_TIMEOUT:-25}
      INSTAVISION_HTTP_BIND: 0.0.0.0
      INSTAVISION_HTTP_PORT: ${INSTAVISION_HTTP_PORT:-8655}
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - ./state:/app/state
    depends_on:
      mediamtx:
        condition: service_started
    healthcheck:
      # 503 from / means "running but not every enrolled camera is streaming",
      # which is exactly what a health check should not treat as healthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${INSTAVISION_HTTP_PORT:-8655}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
