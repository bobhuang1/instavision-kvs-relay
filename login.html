<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaVision · sign in</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef;
          --dim:#8b93a3; --bad:#e05c5c; --ok:#35c46b; --accent:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background: radial-gradient(1200px 600px at 50% -10%, #17202e, #0f1115 60%);
         color:var(--text); font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:min(380px, 92vw); background:var(--panel); border:1px solid var(--line);
          border-radius:16px; padding:26px 24px 22px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 14px var(--accent); }
  h1 { font-size:16px; margin:0; letter-spacing:.02em; }
  h2 { font-size:15px; margin:0 0 4px; }
  p.sub { color:var(--dim); font-size:12.5px; margin:0 0 16px; }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 5px; }
  input { width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
          background:#12151b; color:var(--text); font:inherit; }
  input:focus { outline:none; border-color:#35507f; }
  button { width:100%; margin-top:18px; padding:10px; border-radius:9px; cursor:pointer;
           border:1px solid #2b4f8f; background:#1d3a6b; color:#eaf1ff; font:inherit; font-weight:600; }
  button:hover { background:#22447b; }
  .msg { margin-top:14px; font-size:12.5px; padding:9px 11px; border-radius:9px;
         border:1px solid #4a2020; background:#241010; color:#f0a9a9; display:none; }
  .msg.show { display:block; }
  .hint { margin-top:14px; font-size:12px; color:var(--dim); }
  .foot { margin-top:18px; font-size:11.5px; color:#5f6675; text-align:center; }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand"><span class="dot"></span><h1>InstaVision</h1></div>
  <h2 id="title">Sign in</h2>
  <p class="sub" id="subtitle">InstaVision cameras, relayed to RTSP.</p>

  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" value="admin">

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">

  <div id="hint-row" hidden>
    <label for="hint">Hint (optional)</label>
    <input id="hint" name="hint" autocomplete="off" placeholder="something to jog your memory">
  </div>

  <button id="submit" type="submit">Sign in</button>
  <div class="msg" id="msg"></div>
  <div class="hint" id="stored-hint"></div>
  <div class="foot">Same sign-in model as the OSAIO relay: one administrator, one password.</div>
</form>

<script>
const $ = (id) => document.getElementById(id);
let firstRun = false;

function say(text) {
  const box = $("msg");
  box.textContent = text;
  box.classList.add("show");
}

async function loadSession() {
  const res = await fetch("/api/session");
  const data = await res.json();
  firstRun = data.first_run;
  if (firstRun) {
    $("title").textContent = "Create the administrator";
    $("subtitle").textContent = "First run: choose the password for this gateway.";
    $("hint-row").hidden = false;
    $("submit").textContent = "Create administrator";
    $("password").autocomplete = "new-password";
  } else if (data.hint) {
    $("stored-hint").textContent = "Hint: " + data.hint;
  }
  if (data.authenticated) location.replace("/");
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = {
    username: $("username").value.trim() || "admin",
    password: $("password").value,
    hint: $("hint").value.trim(),
  };
  const url = firstRun ? "/api/setup" : "/api/login";
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    location.replace("/");
  } else {
    say(data.error || ("failed: HTTP " + res.status));
  }
});

loadSession();
</script>
</body>
</html>
